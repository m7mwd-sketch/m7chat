<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#202c33">
  <title>M7 Chat</title>

  <!-- مكتبات Firebase الجاهزة -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b141a;
      color: #e9edef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      height: 100dvh;
      background-color: #111b21;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #222d34;
      border-right: 1px solid #222d34;
      position: relative;
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }
    .screen.active {
      display: flex;
    }

    .header {
      background-color: #202c33;
      padding: 12px 14px;
      border-bottom: 1px solid #2a3942;
      z-index: 10;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-title {
      font-size: 18px;
      font-weight: bold;
      color: #e9edef;
    }
    .my-code-badge {
      background-color: #111b21;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #8696a0;
      border: 1px solid #2a3942;
    }
    .my-code-badge span {
      color: #00a884;
      font-weight: bold;
      font-size: 16px;
      letter-spacing: 1px;
      margin-right: 4px;
      user-select: all;
    }

    .add-contact-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .add-contact-bar input {
      background-color: #2a3942;
      border: none;
      padding: 9px 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .input-name { flex: 1.2; }
    .input-pin { flex: 1; }
    .btn {
      background-color: #00a884;
      color: #111b21;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { background-color: #06cf9c; }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #202c33;
      cursor: pointer;
      gap: 12px;
      transition: background 0.15s;
    }
    .contact-item:hover { background-color: #202c33; }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: #2a3942;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 19px;
      font-weight: bold;
      color: #00a884;
      flex-shrink: 0;
    }
    .contact-info {
      flex: 1;
      min-width: 0;
    }
    .contact-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .contact-name {
      font-size: 15.5px;
      font-weight: bold;
      color: #e9edef;
    }
    .contact-pin-tag {
      font-size: 11px;
      color: #8696a0;
      font-weight: normal;
      margin-right: 5px;
    }
    .contact-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .last-msg {
      font-size: 13px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
    }
    .unread-badge {
      background-color: #00a884;
      color: #111b21;
      font-size: 11.5px;
      font-weight: bold;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 6px;
    }
    .del-contact-btn {
      background: none;
      border: none;
      color: #667781;
      font-size: 14px;
      padding: 4px 6px;
      cursor: pointer;
    }
    .del-contact-btn:hover { color: #ea4335; }
    .empty-list {
      text-align: center;
      color: #8696a0;
      margin-top: 60px;
      padding: 0 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .chat-header {
      background-color: #202c33;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a3942;
    }
    .chat-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      background: none;
      border: none;
      color: #e9edef;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 6px;
    }
    .chat-friend-details h4 {
      font-size: 15.5px;
      color: #e9edef;
    }
    .chat-friend-status {
      font-size: 11.5px;
      color: #00a884;
    }

    .chat-box {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: #0b141a;
      background-image: radial-gradient(#202c33 1px, transparent 1px);
      background-size: 20px 20px;
      scroll-behavior: smooth;
    }
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }
    .msg-wrapper.me { align-self: flex-start; }
    .msg-wrapper.friend { align-self: flex-end; }
    .msg {
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14.5px;
      line-height: 1.45;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .msg-wrapper.me .msg {
      background-color: #005c4b;
      color: #e9edef;
      border-top-right-radius: 0;
    }
    .msg-wrapper.friend .msg {
      background-color: #202c33;
      color: #e9edef;
      border-top-left-radius: 0;
    }
    .quoted-msg {
      background-color: rgba(0, 0, 0, 0.25);
      border-right: 3px solid #00a884;
      padding: 5px 8px;
      border-radius: 5px;
      margin-bottom: 6px;
      font-size: 12.5px;
      color: #d1d7db;
    }
    .quoted-msg strong {
      display: block;
      color: #00a884;
      font-size: 11.5px;
      margin-bottom: 2px;
    }
    .msg img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 8px;
      display: block;
      margin-bottom: 4px;
    }
    .msg audio {
      height: 36px;
      max-width: 220px;
      margin-top: 4px;
      display: block;
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 10.5px;
      color: rgba(233, 237, 239, 0.65);
    }
    .reply-trigger {
      background: none;
      border: none;
      color: rgba(233, 237, 239, 0.7);
      cursor: pointer;
      font-size: 12px;
      padding: 0 4px;
    }
    .ticks {
      font-weight: bold;
      letter-spacing: -2px;
      color: #53bdeb;
      margin-right: 4px;
    }

    .reply-preview-bar {
      background-color: #182229;
      border-top: 1px solid #2a3942;
      border-right: 4px solid #00a884;
      padding: 8px 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .reply-preview-content {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .reply-preview-content strong {
      color: #00a884;
      display: block;
      font-size: 12px;
    }
    .close-reply {
      background: none;
      border: none;
      color: #8696a0;
      font-size: 16px;
      cursor: pointer;
      padding: 0 8px;
    }

    .input-area {
      background-color: #202c33;
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .icon-btn {
      background-color: #2a3942;
      color: #e9edef;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .icon-btn.recording {
      background-color: #ea4335;
      color: #fff;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .input-area input[type="text"] {
      flex: 1;
      background-color: #2a3942;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      min-width: 0;
    }
    .send-btn {
      background-color: #00a884;
      color: #111b21;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- قائمة المحادثات -->
  <div id="contactsScreen" class="screen active">
    <div class="header">
      <div class="top-bar">
        <div class="app-title">M7 Chat 💬</div>
        <div class="my-code-badge">
          كودك: <span id="myCodeDisplay">...</span>
        </div>
      </div>
      <div class="add-contact-bar">
        <input type="text" id="newFriendName" class="input-name" placeholder="اسم صاحبك" />
        <input type="number" id="newFriendPin" class="input-pin" placeholder="كوده (4 أرقام)" />
        <button class="btn" onclick="addContact()">+ إضافة</button>
      </div>
    </div>
    <div id="contactsList" class="contacts-list"></div>
  </div>

  <!-- شاشة الشات المفتوح -->
  <div id="chatScreen" class="screen">
    <div class="chat-header">
      <div class="chat-header-right">
        <button class="back-btn" onclick="closeChat()">➔</button>
        <div class="chat-friend-details">
          <h4 id="activeFriendName">اسم الصديق</h4>
          <div class="chat-friend-status">سحابي دائم 🟢</div>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="reply-preview-bar" id="replyPreviewBar">
      <div class="reply-preview-content">
        <strong id="replySenderName">رد على رسالة</strong>
        <span id="replyTextPreview"></span>
      </div>
      <button class="close-reply" onclick="cancelReply()">✕</button>
    </div>

    <div class="input-area">
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)" />
      <button class="icon-btn" onclick="document.getElementById('imageInput').click()" title="إرسال صورة">📷</button>
      <button class="icon-btn" id="micBtn" onclick="toggleRecording()" title="تسجيل صوت">🎤</button>
      <input type="text" id="msgInput" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendTextMessage()" />
      <button class="send-btn" onclick="sendTextMessage()">➤</button>
    </div>
  </div>

</div>

<script>
  // بيانات Firebase الخاصة بمشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyBG7pwVcdC1e0Chq4yUDbypeLIvzYn3fiI",
    authDomain: "m7chat-8f7ed.firebaseapp.com",
    databaseURL: "https://m7chat-8f7ed-default-rtdb.firebaseio.com",
    projectId: "m7chat-8f7ed",
    storageBucket: "m7chat-8f7ed.firebasestorage.app",
    messagingSenderId: "230625144414",
    appId: "1:230625144414:web:1741a4f5014e66e0524ecf",
    measurementId: "G-BV2DRPR5T0"
  };

  firebase.initializeApp(firebaseConfig);
  const rtdb = firebase.database();

  // الكود التعريفي وقائمة الأصدقاء
  let myPin = localStorage.getItem("m7_my_pin");
  if (!myPin) {
    myPin = Math.floor(1000 + Math.random() * 9000).toString();
    localStorage.setItem("m7_my_pin", myPin);
  }
  document.getElementById("myCodeDisplay").textContent = myPin;

  let contacts = JSON.parse(localStorage.getItem("m7_contacts") || "[]");
  let activeChatPin = null;
  let activeChatListener = null;

  function getRoomId(pin1, pin2) {
    return [pin1, pin2].sort().join("_");
  }

  function saveContacts() {
    localStorage.setItem("m7_contacts", JSON.stringify(contacts));
    renderContactsList();
  }

  function addContact() {
    const name = document.getElementById("newFriendName").value.trim();
    const pin = document.getElementById("newFriendPin").value.trim();
    if (!name || !pin) return alert("اكتب الاسم والكود!");
    if (pin === myPin) return alert("ده كودك أنت!");

    const exist = contacts.find(c => c.pin === pin);
    if (exist) {
      exist.name = name;
    } else {
      contacts.unshift({ pin, name, lastMsg: "اضغط لبدء الشات", unread: 0 });
    }
    document.getElementById("newFriendName").value = "";
    document.getElementById("newFriendPin").value = "";
    saveContacts();
    listenToRoomUpdates(pin);
  }

  function deleteContact(e, pin) {
    e.stopPropagation();
    if (!confirm("حذف الصديق؟")) return;
    contacts = contacts.filter(c => c.pin !== pin);
    saveContacts();
  }

  function renderContactsList() {
    const listEl = document.getElementById("contactsList");
    listEl.innerHTML = "";
    if (contacts.length === 0) {
      listEl.innerHTML = `<div class="empty-list">قائمة المحادثات فارغة.<br>أضف صديقك بالاسم وكوده لبدء المحادثة السحابية الدائمة!</div>`;
      return;
    }
    contacts.forEach(c => {
      const item = document.createElement("div");
      item.className = "contact-item";
      item.onclick = () => openChat(c.pin);
      item.innerHTML = `
        <div class="avatar">${c.name.charAt(0)}</div>
        <div class="contact-info">
          <div class="contact-top">
            <div class="contact-name">${c.name} <span class="contact-pin-tag">#${c.pin}</span></div>
            <button class="del-contact-btn" onclick="deleteContact(event, '${c.pin}')">✕</button>
          </div>
          <div class="contact-bottom">
            <div class="last-msg">${c.lastMsg}</div>
            ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
          </div>
        </div>
      `;
      listEl.appendChild(item);
    });
  }

  // الاستماع للرسائل في الخلفية وتحديث القائمة
  function listenToRoomUpdates(friendPin) {
    const roomId = getRoomId(myPin, friendPin);
    rtdb.ref("rooms/" + roomId + "/lastMessage").on("value", snapshot => {
      const last = snapshot.val();
      if (!last) return;
      const contact = contacts.find(c => c.pin === friendPin);
      if (contact) {
        contact.lastMsg = last.senderPin === myPin ? "أنت: " + last.preview : last.preview;
        if (activeChatPin !== friendPin && last.senderPin !== myPin && last.time !== contact.lastReadTime) {
          contact.unread = (contact.unread || 0) + 1;
        }
        saveContacts();
      }
    });
  }

  contacts.forEach(c => listenToRoomUpdates(c.pin));

  // فتح الشات وإرسال الرسائل
  function openChat(pin) {
    activeChatPin = pin;
    const contact = contacts.find(c => c.pin === pin);
    if (contact) {
      contact.unread = 0;
      contact.lastReadTime = Date.now();
      saveContacts();
      document.getElementById("activeFriendName").textContent = contact.name;
    }
    document.getElementById("contactsScreen").classList.remove("active");
    document.getElementById("chatScreen").classList.add("active");
    cancelReply();

    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";
    const roomId = getRoomId(myPin, pin);

    if (activeChatListener) activeChatListener.off();

    activeChatListener = rtdb.ref("rooms/" + roomId + "/messages");
    activeChatListener.on("child_added", snapshot => {
      const msg = snapshot.val();
      renderMessage(msg);
    });
  }

  function closeChat() {
    activeChatPin = null;
    cancelReply();
    if (activeChatListener) activeChatListener.off();
    document.getElementById("chatScreen").classList.remove("active");
    document.getElementById("contactsScreen").classList.add("active");
    renderContactsList();
  }

  let currentReplyObj = null;
  function setReply(sender, preview) {
    currentReplyObj = { sender, text: preview };
    document.getElementById("replySenderName").textContent = sender === "me" ? "رد على نفسك" : "رد على صديقك";
    document.getElementById("replyTextPreview").textContent = preview;
    document.getElementById("replyPreviewBar").style.display = "flex";
    document.getElementById("msgInput").focus();
  }

  function cancelReply() {
    currentReplyObj = null;
    document.getElementById("replyPreviewBar").style.display = "none";
  }

  function pushMessage(type, content, previewText) {
    if (!activeChatPin) return;
    const roomId = getRoomId(myPin, activeChatPin);
    const now = new Date();
    const msgData = {
      senderPin: myPin,
      type: type,
      content: content,
      replyTo: currentReplyObj,
      time: now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
      timestamp: Date.now()
    };

    rtdb.ref("rooms/" + roomId + "/messages").push(msgData);
    rtdb.ref("rooms/" + roomId + "/lastMessage").set({
      senderPin: myPin,
      preview: previewText,
      time: Date.now()
    });

    cancelReply();
  }

  function sendTextMessage() {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text) return;
    pushMessage("text", text, text);
    input.value = "";
    input.focus();
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX = 700;
        let w = img.width, h = img.height;
        if (w > h && w > MAX) { h *= MAX / w; w = MAX; }
        else if (h > MAX) { w *= MAX / h; h = MAX; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        pushMessage("image", canvas.toDataURL("image/jpeg", 0.65), "📷 صورة");
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  async function toggleRecording() {
    const micBtn = document.getElementById("micBtn");
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
          const reader = new FileReader();
          reader.onloadend = () => {
            pushMessage("audio", reader.result, "🎤 ريكورد");
          };
          reader.readAsDataURL(audioBlob);
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "⏹️";
        document.getElementById("msgInput").placeholder = "🔴 جاري التسجيل...";
      } catch (err) {
        alert("تأكد من فتح الرابط عبر HTTPS للسماح بالمايكروفون.");
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";
      document.getElementById("msgInput").placeholder = "اكتب رسالتك...";
    }
  }

  function renderMessage(msg) {
    const chatBox = document.getElementById("chatBox");
    const isMe = msg.senderPin === myPin;
    const wrapper = document.createElement("div");
    wrapper.className = "msg-wrapper " + (isMe ? "me" : "friend");

    const bubble = document.createElement("div");
    bubble.className = "msg";

    if (msg.replyTo) {
      const quote = document.createElement("div");
      quote.className = "quoted-msg";
      quote.innerHTML = `<strong>${msg.replyTo.sender === "me" ? "أنت" : "صديقك"}</strong>${msg.replyTo.text}`;
      bubble.appendChild(quote);
    }

    let summary = "";
    if (msg.type === "text") {
      const p = document.createElement("div");
      p.textContent = msg.content;
      bubble.appendChild(p);
      summary = msg.content;
    } else if (msg.type === "image") {
      const img = document.createElement("img");
      img.src = msg.content;
      bubble.appendChild(img);
      summary = "📷 صورة";
    } else if (msg.type === "audio") {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = msg.content;
      bubble.appendChild(audio);
      summary = "🎤 ريكورد";
    }

    const meta = document.createElement("div");
    meta.className = "msg-meta";

    const replyBtn = document.createElement("button");
    replyBtn.className = "reply-trigger";
    replyBtn.textContent = "↩️ رد";
    replyBtn.onclick = () => setReply(isMe ? "me" : "friend", summary);
    meta.appendChild(replyBtn);

    const timeSpan = document.createElement("span");
    timeSpan.innerHTML = `${msg.time} ${isMe ? '<span class="ticks">✓✓</span>' : ''}`;
    meta.appendChild(timeSpan);

    bubble.appendChild(meta);
    wrapper.appendChild(bubble);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  renderContactsList();
</script>
